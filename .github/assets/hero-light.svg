<radialGradient id="auroraCyan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7FD4E4" stop-opacity=".22"/><stop offset="1" stop-color="#7FD4E4" stop-opacity="0"/></radialGradient>
<radialGradient id="auroraViolet" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B98CF0" stop-opacity=".16"/><stop offset="1" stop-color="#B98CF0" stop-opacity="0"/></radialGradient>
