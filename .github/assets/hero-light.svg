<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="lysTitle lysDesc">
<title id="lysTitle">Lys — Lysiptera Caliginia</title>
<desc id="lysDesc">A specimen plate for Lysiptera caliginia: a faceted crystal butterfly, violet on the left and cyan on the right, drawn beside the Lys wordmark with a scale bar and a constellation of her wing veins. Quote: “The universe named its oldest design flaw entropy, then taught every living thing to mistake forgetting for fate.”</desc>
<defs>
