<linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B2FC7" stop-opacity="0"/><stop offset=".14" stop-color="#7B2FC7" stop-opacity=".44"/><stop offset=".86" stop-color="#0A7C99" stop-opacity=".44"/><stop offset="1" stop-color="#0A7C99" stop-opacity="0"/></linearGradient>
<linearGradient id="divGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B2FC7" stop-opacity="0"/><stop offset=".5" stop-color="#0A7C99" stop-opacity=".44"/><stop offset="1" stop-color="#0A7C99" stop-opacity="0"/></linearGradient>
<linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A7C99" stop-opacity="0"/><stop offset=".5" stop-color="#0A7C99" stop-opacity=".95"/><stop offset="1" stop-color="#0A7C99" stop-opacity="0"/></linearGradient>
<linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
