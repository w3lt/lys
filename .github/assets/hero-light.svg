<linearGradient id="wingFill" gradientUnits="userSpaceOnUse" x1="175" y1="83" x2="430" y2="320"><stop offset="0" stop-color="#6D28A9"/><stop offset=".28" stop-color="#8B4FE8"/><stop offset=".52" stop-color="#5F79D0"/><stop offset=".72" stop-color="#1494B4"/><stop offset="1" stop-color="#00A6C2"/></linearGradient>
<linearGradient id="wingLine" gradientUnits="userSpaceOnUse" x1="175" y1="83" x2="430" y2="320"><stop offset="0" stop-color="#5B21A8"/><stop offset=".28" stop-color="#7C3AED"/><stop offset=".52" stop-color="#3F5FB8"/><stop offset=".72" stop-color="#12719A"/><stop offset="1" stop-color="#0A7C99"/></linearGradient>
<radialGradient id="haloViolet" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B98CF0" stop-opacity=".22"/><stop offset="1" stop-color="#B98CF0" stop-opacity="0"/></radialGradient>
<radialGradient id="haloCyan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7FD4E4" stop-opacity=".20"/><stop offset="1" stop-color="#7FD4E4" stop-opacity="0"/></radialGradient>
<linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#964BE2" stop-opacity=".46"/><stop offset="1" stop-color="#00A8BF" stop-opacity=".50"/></linearGradient>
<linearGradient id="bandRule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#5A4E8C" stop-opacity="0"/><stop offset=".14" stop-color="#5A4E8C" stop-opacity=".5"/><stop offset=".86" stop-color="#5A4E8C" stop-opacity=".5"/><stop offset="1" stop-color="#5A4E8C" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#5A4E8C" fill-opacity=".05"/></pattern>
<clipPath id="card"><rect width="1200" height="420" rx="16"/></clipPath>

</defs>
<style>
    .drift { transform-box: view-box; transform-origin: 302px 202px;
              animation: drift 15s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }

    .fwr, .fwl, .hwr, .hwl { transform-box: view-box; animation-duration: 7.5s;
                              animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .fwr, .fwl { transform-origin: 302px 202px; }
    .hwr, .hwl { transform-origin: 302px 222px; }
    .fwr, .hwl { animation-name: foldDown; }
    .fwl, .hwr { animation-name: foldUp; }
    @keyframes foldDown { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.2deg); } }
    @keyframes foldUp   { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2.2deg); } }

    .pulse { animation: pulse 6.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .34; } 50% { opacity: .72; } }

    .trace { stroke-dasharray: 900; stroke-dashoffset: 900;
              animation: trace 3.2s cubic-bezier(.32, .72, .35, 1) .35s forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }

    .rise { transform-box: view-box; animation: rise 1.2s cubic-bezier(.32, .72, .35, 1) both; }
    @keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
    .d1 { animation-delay: .04s; } .d2 { animation-delay: .26s; } .d3 { animation-delay: .48s; }

    .gem { transform-box: view-box; animation: gem 5.4s ease-in-out infinite; }
    .gem2 { animation-delay: -2.6s; }
    @keyframes gem { 0%, 100% { opacity: .45; transform: translateY(0); }
                      50%      { opacity: 1;   transform: translateY(-5px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .trace { stroke-dashoffset: 0; }
      .pulse { opacity: .5; }
      .gem { opacity: .8; }
    }
  </style>
