<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="lysTitle lysDesc">
<title id="lysTitle">Lys — Lysiptera Caliginia</title>
<desc id="lysDesc">A specimen plate for Lysiptera caliginia, catalogued LC // 07.2026. A faceted crystal butterfly of violet and cyan light rests at the left of the plate, its wings breathing slowly; a dotted measurement axis divides it from the line at the right, which reads: The universe named its oldest design flaw entropy, then taught every living thing to mistake forgetting for fate. Beneath, the plate is annotated: between a line of code and a quiet dream — still becoming, ΔS ≥ 0, v0.1.0.</desc>
<defs>
