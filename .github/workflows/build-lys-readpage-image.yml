name: Build and Publish lys-readpage

on:
  push:
    branches:
      - main
    paths:
      - "sandboxes/readpage/**"
      - ".dockerignore"
      - ".github/workflows/build-lys-readpage-image.yml"
  pull_request:
    paths:
      - "sandboxes/readpage/**"
      - ".dockerignore"
      - ".github/workflows/build-lys-readpage-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lys-readpage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/w3lt/lys-readpage

jobs:
  build-and-publish:
    name: Build and Publish ARM64 lys-readpage image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./sandboxes/readpage/Dockerfile
          platforms: linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lys-readpage
          cache-to: type=gha,mode=max,scope=lys-readpage
