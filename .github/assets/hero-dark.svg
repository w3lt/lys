<style>
    .drift { transform-box: view-box; transform-origin: 940px 225px; animation: drift 14s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }

    .pulse { animation: pulse 5.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }

    .rise { transform-box: view-box; animation: rise 1.2s cubic-bezier(.32, .72, .35, 1) both; }
    @keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
    .d1 { animation-delay: .04s; } .d2 { animation-delay: .22s; } .d3 { animation-delay: .44s; }

    .trace { stroke-dasharray: 360; stroke-dashoffset: 360;
             animation: trace 3.4s cubic-bezier(.32, .72, .35, 1) .5s forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .trace { stroke-dashoffset: 0; }
    }
  </style>
