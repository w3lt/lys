[package]
name = "email"
version = "0.1.0"
edition = "2024"

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
mail-parser = "1"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rustls-platform-verifier = "0.7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"

[dev-dependencies]
base64 = "0.22"
rcgen = "0.14"
