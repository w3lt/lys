name: Build macOS desktop app

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tag, commit, and package versions
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH without leading zeroes." >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          target_version="$(cat "$GITHUB_WORKSPACE/VERSION")" # Target version is the version we want to release

          if [[ "$target_version" != "$release_version" ]]; then
            echo "Target version must equal $release_version, found $target_version." >&2
            exit 1
          fi

          checked_out_commit="$(git rev-parse 'HEAD^{commit}')"
          triggering_commit="$(git rev-parse "${TRIGGER_SHA}^{commit}")"
          if [[ "$checked_out_commit" != "$triggering_commit" ]]; then
            echo "The checked-out commit does not match the triggering revision." >&2
            exit 1
          fi

          printf 'commit=%s\n' "$checked_out_commit" >> "$GITHUB_OUTPUT"

  checks:
    name: Check desktop sources
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier . --check

      - name: Lint workspace sources
        run: pnpm exec eslint .

      - name: Check desktop types
        run: pnpm --filter @lys/desktop exec tsc --noEmit

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Lint Rust sources
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.architecture }} app
    needs:
      - validate
      - checks
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            rust_target: aarch64-apple-darwin
            binary_architecture: arm64

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rust_target }}

      - name: Install locked dependencies
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target "$RUST_TARGET"

      - name: Build ad-hoc signed application
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: >-
          pnpm --filter @lys/desktop exec tauri build
          --ci
          --bundles app
          --target "$RUST_TARGET"
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          -- --locked

      - name: Verify and package application
        id: package
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BINARY_ARCHITECTURE: ${{ matrix.binary_architecture }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail

          app_path="apps/desktop/src-tauri/target/${RUST_TARGET}/release/bundle/macos/Lys.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Expected application bundle was not produced at $app_path." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_architectures="$(lipo -archs "$app_path/Contents/MacOS/$executable_name")"
          if [[ "$binary_architectures" != "$BINARY_ARCHITECTURE" ]]; then
            echo "Expected $BINARY_ARCHITECTURE binary, found: $binary_architectures" >&2
            exit 1
          fi

          candidate_directory="$(mktemp -d "${RUNNER_TEMP}/lys-candidate.XXXXXX")"
          archive_name="Lys-macos-${ARCHITECTURE}.tar.gz"
          archive_path="$candidate_directory/$archive_name"
          checksum_path="$candidate_directory/${archive_name}.sha256"
          metadata_path="$candidate_directory/Lys-macos-${ARCHITECTURE}.metadata.json"

          COPYFILE_DISABLE=1 /usr/bin/tar -czf "$archive_path" -C "$(dirname "$app_path")" Lys.app
          archive_sha256="$(shasum -a 256 "$archive_path" | awk '{ print $1 }')"
          printf '%s  %s\n' "$archive_sha256" "$archive_name" > "$checksum_path"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg architecture "$ARCHITECTURE" \
            --arg archive "$archive_name" \
            --arg sha256 "$archive_sha256" \
            '{
              repository: $repository,
              tag: $tag,
              commit: $commit,
              run_id: $run_id,
              run_attempt: $run_attempt,
              architecture: $architecture,
              archive: $archive,
              sha256: $sha256
            }' > "$metadata_path"

          archive_listing="$(mktemp "${RUNNER_TEMP}/lys-${ARCHITECTURE}-archive.XXXXXX.txt")"
          /usr/bin/tar -tzf "$archive_path" > "$archive_listing"
          grep -Fxq 'Lys.app/' "$archive_listing"
          printf 'candidate_directory=%s\n' "$candidate_directory" >> "$GITHUB_OUTPUT"

      - name: Upload build candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lys-macos-${{ matrix.architecture }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.candidate_directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
