<style>
    .breath { transform-box: view-box; transform-origin: 272px 233.32px; animation: breath 9s ease-in-out infinite; }
    @keyframes breath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.022); } }

    .gem { transform-box: view-box; transform-origin: 272px 233.32px; animation: gemPulse 3.8s ease-in-out infinite; }
    @keyframes gemPulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }

    .node { animation: twinkle 5s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: .12; } to { opacity: var(--o, .5); } }

    .glint { animation: glint 8s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes glint {
      0%        { transform: translateX(0); opacity: 0; }
      7%        { opacity: 1; }
      46%       { opacity: 1; }
      54%, 100% { transform: translateX(1420px); opacity: 0; }
    }

    .sweep { animation: sweep 9s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 34%, 100% { transform: translateX(560px); } }

    .rise { transform-box: view-box; animation: rise 1.1s cubic-bezier(.32, .72, .35, 1) both; }
    @keyframes rise { from { transform: translateY(9px); } to { transform: none; } }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .26s; } .d3 { animation-delay: .44s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .node { opacity: .38; }
    }
  </style>
