[package]
name = "lys-desktop"
version = "0.1.0"
description = "Lysiptera Caliginia desktop application"
authors = ["Welt <w3lt@negentropy.studio>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lys_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The backend lifecycle is built on Darwin process-group semantics, so libc is
# only ever linked for the supported target. `src/lib.rs` rejects other
# platforms at compile time rather than letting this resolve to nothing.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
