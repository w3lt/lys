<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Anatomy of one Lys chat turn</title>
  <desc id="flowDesc">The Tauri host starts the backend. The React desktop UI sends POST /api/v1/chat to the Fastify backend over loopback. The backend persists the turn in SQLite, calls LM Studio for completions, and streams typed SSE events back to the desktop: start-new-conversation-turn, start-existing-conversation-turn, delta, title, done, error.</desc>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04020B"/>
      <stop offset=".42" stop-color="#0C031F"/>
      <stop offset=".7" stop-color="#000A20"/>
      <stop offset="1" stop-color="#001623"/>
    </linearGradient>
    <radialGradient id="fglowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00A0B1" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00A0B1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglowV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6F32A7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6F32A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AC62FB" stop-opacity=".42"/>
      <stop offset="1" stop-color="#00D0E2" stop-opacity=".5"/>
    </linearGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8FA8C8" fill-opacity=".05"/>
    </pattern>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#AC62FB"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#00D0E2"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#E7B643"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#5E7794"/>
    </marker>
    <clipPath id="fcard"><rect width="1200" height="560" rx="16"/></clipPath>
  </defs>

  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    .stream { stroke-dasharray: 6 9; animation: stream 1.05s linear infinite; }
    @keyframes stream { from { stroke-dashoffset: 15; } to { stroke-dashoffset: 0; } }

    .pkt-req { animation: pktReq 2.6s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes pktReq {
      0%       { transform: translateX(0);     opacity: 0; }
      8%       { opacity: 1; }
      46%      { opacity: 1; }
      54%, 100% { transform: translateX(150px); opacity: 0; }
    }
    .pkt-up { animation: pktUp 2.6s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes pktUp {
      0%, 24%  { transform: translateY(0);    opacity: 0; }
      32%      { opacity: 1; }
      62%      { opacity: 1; }
      70%, 100% { transform: translateY(60px); opacity: 0; }
    }
    .pkt-host { animation: pktHost 4.4s ease-in-out infinite; }
    @keyframes pktHost {
      0%, 60%   { transform: translateY(0);    opacity: 0; }
      66%       { opacity: 1; }
      88%       { opacity: 1; }
      94%, 100% { transform: translateY(42px); opacity: 0; }
    }

    .ev { animation: ev 5.7s ease-in-out infinite; }
    @keyframes ev {
      0%        { opacity: .34; }
      5%        { opacity: 1; }
      15%       { opacity: 1; }
      24%, 100% { opacity: .34; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ev { opacity: .85; }
      .pkt-req, .pkt-up, .pkt-host { opacity: 1; }
    }
  </style>

  <g clip-path="url(#fcard)">
    <rect width="1200" height="560" fill="url(#fbg)"/>
    <rect width="1200" height="560" fill="url(#fdots)"/>
    <ellipse cx="1050" cy="60" rx="520" ry="340" fill="url(#fglowC)"/>
    <ellipse cx="120" cy="520" rx="520" ry="340" fill="url(#fglowV)"/>

    <text x="60" y="46" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#97A7B7">ONE CHAT TURN</text>
    <text x="1140" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#9EAABB">loopback only · 127.0.0.1</text>
    <rect x="60" y="58" width="1080" height="1" fill="#5E7794" opacity=".22"/>

    <text x="1140" y="104" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#9EAABB">The desktop UI never calls LM Studio directly.</text>
    <text x="1140" y="126" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#9EAABB">Every chat request opens exactly one SSE stream.</text>

    <!-- Nodes -->
    <g class="node">
      <rect x="60" y="78" width="260" height="76" rx="10" fill="#100E24" fill-opacity=".82" stroke="#37C9DB" stroke-opacity=".22"/>
      <rect x="60" y="78" width="3" height="76" rx="1.5" fill="#AC62FB" opacity=".8"/>
      <circle class="pulse" cx="80" cy="106" r="3.4" fill="#AC62FB"/>
      <text x="94" y="111" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E4F1F9">Tauri host</text>
      <text x="80" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">Rust · process + settings</text>
      </g>
    <g class="node">
      <rect x="60" y="196" width="260" height="100" rx="10" fill="#100E24" fill-opacity=".82" stroke="#37C9DB" stroke-opacity=".22"/>
      <rect x="60" y="196" width="3" height="100" rx="1.5" fill="#AC62FB" opacity=".8"/>
      <circle class="pulse" cx="80" cy="224" r="3.4" fill="#AC62FB"/>
      <text x="94" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E4F1F9">Desktop UI</text>
      <text x="80" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">React 19 · Vite</text>
      <text x="80" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">Zustand chat store</text>
      </g>
    <g class="node">
      <rect x="470" y="196" width="260" height="100" rx="10" fill="#100E24" fill-opacity=".82" stroke="#37C9DB" stroke-opacity=".22"/>
      <rect x="470" y="196" width="3" height="100" rx="1.5" fill="#00D0E2" opacity=".8"/>
      <circle class="pulse" cx="490" cy="224" r="3.4" fill="#00D0E2"/>
      <text x="504" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E4F1F9">Backend</text>
      <text x="490" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">Fastify 5 · @fastify/sse</text>
      <text x="490" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">@lys/protocol · Zod</text>
      </g>
    <g class="node">
      <rect x="880" y="196" width="260" height="100" rx="10" fill="#100E24" fill-opacity=".82" stroke="#37C9DB" stroke-opacity=".22" stroke-dasharray="5 4"/>
      <rect x="880" y="196" width="3" height="100" rx="1.5" fill="#E7B643" opacity=".8"/>
      <circle class="pulse" cx="900" cy="224" r="3.4" fill="#E7B643"/>
      <text x="914" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E4F1F9">LM Studio</text>
      <rect x="1062.8" y="213" width="63.2" height="19" rx="9.5" fill="#E7B643" fill-opacity=".14" stroke="#E7B643" stroke-opacity=".4"/>
      <text x="1094.4" y="226.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#E7B643" textLength="47.2" lengthAdjust="spacing">external</text>
      <text x="900" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">127.0.0.1:1234</text>
      <text x="900" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">OpenAI-compatible</text>
      </g>
    <g class="node">
      <rect x="470" y="356" width="260" height="76" rx="10" fill="#100E24" fill-opacity=".82" stroke="#37C9DB" stroke-opacity=".22"/>
      <rect x="470" y="356" width="3" height="76" rx="1.5" fill="#D2E4F0" opacity=".8"/>
      <circle class="pulse" cx="490" cy="384" r="3.4" fill="#D2E4F0"/>
      <text x="504" y="389" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E4F1F9">SQLite</text>
      <text x="490" y="414" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">node:sqlite · ~/.lys/lys_db.sqlite</text>
      </g>

    <!-- Host to UI -->
    <path d="M190 154 L190 190" stroke="#AC62FB" stroke-opacity=".5" stroke-width="1.5"
          stroke-dasharray="4 4" fill="none" marker-end="url(#arrV)"/>
    <rect class="pkt-host" x="187" y="156" width="6" height="6" rx="3" fill="#AC62FB"/>
    <text x="206" y="178" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#9EAABB">start · stop · ~/.lys/settings.json</text>

    <!-- UI to backend -->
    <text x="395" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#97A7B7">POST /api/v1/chat</text>
    <path d="M320 226 L464 226" stroke="#5E7794" stroke-opacity=".5" stroke-width="1.5"
          fill="none" marker-end="url(#arrN)"/>
    <rect class="pkt-req" x="322" y="223.5" width="16" height="5" rx="2.5" fill="#AC62FB"/>

    <!-- Backend to UI -->
    <path class="stream" d="M464 268 L326 268" stroke="#00D0E2" stroke-opacity=".8"
          stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>
    <text x="395" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#00D0E2">text/event-stream</text>

    <!-- Backend to LM Studio -->
    <text x="805" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#97A7B7">chat.completions</text>
    <path d="M730 226 L874 226" stroke="#5E7794" stroke-opacity=".5" stroke-width="1.5"
          fill="none" marker-end="url(#arrN)"/>
    <rect class="pkt-req" x="732" y="223.5" width="16" height="5" rx="2.5" fill="#00D0E2"
          style="animation-delay:.5s"/>

    <path class="stream" d="M874 268 L736 268" stroke="#E7B643" stroke-opacity=".75"
          stroke-width="1.8" fill="none" marker-end="url(#arrP)" style="animation-delay:-.4s"/>
    <text x="805" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9EAABB">generated tokens</text>

    <!-- Backend to SQLite -->
    <path d="M600 296 L600 350" stroke="#5E7794" stroke-opacity=".5" stroke-width="1.5" fill="none"
          marker-end="url(#arrN)"/>
    <rect class="pkt-up" x="597" y="298" width="6" height="6" rx="3" fill="#D2E4F0"/>
    <text x="614" y="328" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#9EAABB">insert turn · update lifecycle</text>

    <!-- Stream vocabulary -->
    <rect x="60" y="446" width="1080" height="1" fill="#5E7794" opacity=".18"/>
    <text x="60" y="468" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#97A7B7">STREAM VOCABULARY</text>
    <text x="1140" y="468" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#9EAABB">chatApiStreamEventSchema · @lys/protocol</text>
    <g class="events">
      <g class="ev" style="animation-delay:0.00s"><rect x="245.8" y="478" width="200.7" height="30" rx="15.0" fill="#AC62FB" fill-opacity=".13" stroke="#AC62FB" stroke-opacity=".55"/><text x="346.2" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#AC62FB" textLength="178.7" lengthAdjust="spacing">start-new-conversation-turn</text></g>
      <g class="ev" style="animation-delay:0.95s"><rect x="458.6" y="478" width="233.8" height="30" rx="15.0" fill="#AC62FB" fill-opacity=".13" stroke="#AC62FB" stroke-opacity=".55"/><text x="575.5" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#AC62FB" textLength="211.8" lengthAdjust="spacing">start-existing-conversation-turn</text></g>
      <g class="ev" style="animation-delay:1.90s"><rect x="704.4" y="478" width="55.1" height="30" rx="15.0" fill="#00D0E2" fill-opacity=".13" stroke="#00D0E2" stroke-opacity=".55"/><text x="731.9" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#00D0E2" textLength="33.1" lengthAdjust="spacing">delta</text></g>
      <g class="ev" style="animation-delay:2.85s"><rect x="771.5" y="478" width="55.1" height="30" rx="15.0" fill="#D2E4F0" fill-opacity=".13" stroke="#D2E4F0" stroke-opacity=".55"/><text x="799.0" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#D2E4F0" textLength="33.1" lengthAdjust="spacing">title</text></g>
      <g class="ev" style="animation-delay:3.80s"><rect x="838.6" y="478" width="48.5" height="30" rx="15.0" fill="#4ECA7A" fill-opacity=".13" stroke="#4ECA7A" stroke-opacity=".55"/><text x="862.8" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#4ECA7A" textLength="26.5" lengthAdjust="spacing">done</text></g>
      <g class="ev" style="animation-delay:4.75s"><rect x="899.1" y="478" width="55.1" height="30" rx="15.0" fill="#FA6863" fill-opacity=".13" stroke="#FA6863" stroke-opacity=".55"/><text x="926.6" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#FA6863" textLength="33.1" lengthAdjust="spacing">error</text></g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="558.5" rx="15.25" fill="none"
        stroke="url(#fframe)" stroke-width="1.5"/>
</svg>
