<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Anatomy of one Lys chat turn</title>
  <desc id="flowDesc">The Tauri host starts the backend. The React desktop UI sends POST /api/v1/chat to the Fastify backend over loopback. The backend persists the turn in SQLite, calls LM Studio for completions, and streams typed SSE events back to the desktop: start-new-conversation-turn, start-existing-conversation-turn, delta, title, done, error.</desc>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EAFF"/>
      <stop offset=".42" stop-color="#F1F5FF"/>
      <stop offset=".7" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#DCF3FB"/>
    </linearGradient>
    <radialGradient id="fglowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#73DEE9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#73DEE9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglowV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B98CF0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#B98CF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#964BE2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00CADB" stop-opacity=".5"/>
    </linearGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5B4A8A" fill-opacity=".07"/>
    </pattern>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7029B1"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#0083A0"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#926100"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#8CA0BC"/>
    </marker>
    <clipPath id="fcard"><rect width="1200" height="560" rx="16"/></clipPath>
  </defs>

  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    .stream { stroke-dasharray: 6 9; animation: stream 1.05s linear infinite; }
    @keyframes stream { from { stroke-dashoffset: 15; } to { stroke-dashoffset: 0; } }

    .pkt-req { animation: pktReq 2.6s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes pktReq {
      0%       { transform: translateX(0);     opacity: 0; }
      8%       { opacity: 1; }
      46%      { opacity: 1; }
      54%, 100% { transform: translateX(150px); opacity: 0; }
    }
    .pkt-up { animation: pktUp 2.6s cubic-bezier(.32, .72, .35, 1) infinite; }
    @keyframes pktUp {
      0%, 24%  { transform: translateY(0);    opacity: 0; }
      32%      { opacity: 1; }
      62%      { opacity: 1; }
      70%, 100% { transform: translateY(60px); opacity: 0; }
    }
    .pkt-host { animation: pktHost 4.4s ease-in-out infinite; }
    @keyframes pktHost {
      0%, 60%   { transform: translateY(0);    opacity: 0; }
      66%       { opacity: 1; }
      88%       { opacity: 1; }
      94%, 100% { transform: translateY(42px); opacity: 0; }
    }

    .ev { animation: ev 5.7s ease-in-out infinite; }
    @keyframes ev {
      0%        { opacity: .34; }
      5%        { opacity: 1; }
      15%       { opacity: 1; }
      24%, 100% { opacity: .34; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ev { opacity: .85; }
      .pkt-req, .pkt-up, .pkt-host { opacity: 1; }
    }
  </style>

  <g clip-path="url(#fcard)">
    <rect width="1200" height="560" fill="url(#fbg)"/>
    <rect width="1200" height="560" fill="url(#fdots)"/>
    <ellipse cx="1050" cy="60" rx="520" ry="340" fill="url(#fglowC)"/>
    <ellipse cx="120" cy="520" rx="520" ry="340" fill="url(#fglowV)"/>

    <text x="60" y="46" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#565C77">ONE CHAT TURN</text>
    <text x="1140" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#757D93">loopback only · 127.0.0.1</text>
    <rect x="60" y="58" width="1080" height="1" fill="#8CA0BC" opacity=".22"/>

    <text x="1140" y="104" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#757D93">The desktop UI never calls LM Studio directly.</text>
    <text x="1140" y="126" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#757D93">Every chat request opens exactly one SSE stream.</text>

    <!-- Nodes -->
    <g class="node">
      <rect x="60" y="78" width="260" height="76" rx="10" fill="#FFFFFF" fill-opacity=".78" stroke="#89A0C1" stroke-opacity=".55"/>
      <rect x="60" y="78" width="3" height="76" rx="1.5" fill="#7029B1" opacity=".8"/>
      <circle class="pulse" cx="80" cy="106" r="3.4" fill="#7029B1"/>
      <text x="94" y="111" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#150F26">Tauri host</text>
      <text x="80" y="136" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">Rust · process + settings</text>
      </g>
    <g class="node">
      <rect x="60" y="196" width="260" height="100" rx="10" fill="#FFFFFF" fill-opacity=".78" stroke="#89A0C1" stroke-opacity=".55"/>
      <rect x="60" y="196" width="3" height="100" rx="1.5" fill="#7029B1" opacity=".8"/>
      <circle class="pulse" cx="80" cy="224" r="3.4" fill="#7029B1"/>
      <text x="94" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#150F26">Desktop UI</text>
      <text x="80" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">React 19 · Vite</text>
      <text x="80" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">Zustand chat store</text>
      </g>
    <g class="node">
      <rect x="470" y="196" width="260" height="100" rx="10" fill="#FFFFFF" fill-opacity=".78" stroke="#89A0C1" stroke-opacity=".55"/>
      <rect x="470" y="196" width="3" height="100" rx="1.5" fill="#0083A0" opacity=".8"/>
      <circle class="pulse" cx="490" cy="224" r="3.4" fill="#0083A0"/>
      <text x="504" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#150F26">Backend</text>
      <text x="490" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">Fastify 5 · @fastify/sse</text>
      <text x="490" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">@lys/protocol · Zod</text>
      </g>
    <g class="node">
      <rect x="880" y="196" width="260" height="100" rx="10" fill="#FFFFFF" fill-opacity=".78" stroke="#89A0C1" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <rect x="880" y="196" width="3" height="100" rx="1.5" fill="#926100" opacity=".8"/>
      <circle class="pulse" cx="900" cy="224" r="3.4" fill="#926100"/>
      <text x="914" y="229" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#150F26">LM Studio</text>
      <rect x="1062.8" y="213" width="63.2" height="19" rx="9.5" fill="#926100" fill-opacity=".14" stroke="#926100" stroke-opacity=".4"/>
      <text x="1094.4" y="226.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#926100" textLength="47.2" lengthAdjust="spacing">external</text>
      <text x="900" y="254" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">127.0.0.1:1234</text>
      <text x="900" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">OpenAI-compatible</text>
      </g>
    <g class="node">
      <rect x="470" y="356" width="260" height="76" rx="10" fill="#FFFFFF" fill-opacity=".78" stroke="#89A0C1" stroke-opacity=".55"/>
      <rect x="470" y="356" width="3" height="76" rx="1.5" fill="#5B6378" opacity=".8"/>
      <circle class="pulse" cx="490" cy="384" r="3.4" fill="#5B6378"/>
      <text x="504" y="389" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#150F26">SQLite</text>
      <text x="490" y="414" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">node:sqlite · ~/.lys/lys_db.sqlite</text>
      </g>

    <!-- Host to UI -->
    <path d="M190 154 L190 190" stroke="#7029B1" stroke-opacity=".5" stroke-width="1.5"
          stroke-dasharray="4 4" fill="none" marker-end="url(#arrV)"/>
    <rect class="pkt-host" x="187" y="156" width="6" height="6" rx="3" fill="#7029B1"/>
    <text x="206" y="178" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#757D93">start · stop · ~/.lys/settings.json</text>

    <!-- UI to backend -->
    <text x="395" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#565C77">POST /api/v1/chat</text>
    <path d="M320 226 L464 226" stroke="#8CA0BC" stroke-opacity=".5" stroke-width="1.5"
          fill="none" marker-end="url(#arrN)"/>
    <rect class="pkt-req" x="322" y="223.5" width="16" height="5" rx="2.5" fill="#7029B1"/>

    <!-- Backend to UI -->
    <path class="stream" d="M464 268 L326 268" stroke="#0083A0" stroke-opacity=".8"
          stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>
    <text x="395" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#0083A0">text/event-stream</text>

    <!-- Backend to LM Studio -->
    <text x="805" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#565C77">chat.completions</text>
    <path d="M730 226 L874 226" stroke="#8CA0BC" stroke-opacity=".5" stroke-width="1.5"
          fill="none" marker-end="url(#arrN)"/>
    <rect class="pkt-req" x="732" y="223.5" width="16" height="5" rx="2.5" fill="#0083A0"
          style="animation-delay:.5s"/>

    <path class="stream" d="M874 268 L736 268" stroke="#926100" stroke-opacity=".75"
          stroke-width="1.8" fill="none" marker-end="url(#arrP)" style="animation-delay:-.4s"/>
    <text x="805" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#757D93">generated tokens</text>

    <!-- Backend to SQLite -->
    <path d="M600 296 L600 350" stroke="#8CA0BC" stroke-opacity=".5" stroke-width="1.5" fill="none"
          marker-end="url(#arrN)"/>
    <rect class="pkt-up" x="597" y="298" width="6" height="6" rx="3" fill="#5B6378"/>
    <text x="614" y="328" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#757D93">insert turn · update lifecycle</text>

    <!-- Stream vocabulary -->
    <rect x="60" y="446" width="1080" height="1" fill="#8CA0BC" opacity=".18"/>
    <text x="60" y="468" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#565C77">STREAM VOCABULARY</text>
    <text x="1140" y="468" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#757D93">chatApiStreamEventSchema · @lys/protocol</text>
    <g class="events">
      <g class="ev" style="animation-delay:0.00s"><rect x="245.8" y="478" width="200.7" height="30" rx="15.0" fill="#7029B1" fill-opacity=".13" stroke="#7029B1" stroke-opacity=".55"/><text x="346.2" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7029B1" textLength="178.7" lengthAdjust="spacing">start-new-conversation-turn</text></g>
      <g class="ev" style="animation-delay:0.95s"><rect x="458.6" y="478" width="233.8" height="30" rx="15.0" fill="#7029B1" fill-opacity=".13" stroke="#7029B1" stroke-opacity=".55"/><text x="575.5" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7029B1" textLength="211.8" lengthAdjust="spacing">start-existing-conversation-turn</text></g>
      <g class="ev" style="animation-delay:1.90s"><rect x="704.4" y="478" width="55.1" height="30" rx="15.0" fill="#0083A0" fill-opacity=".13" stroke="#0083A0" stroke-opacity=".55"/><text x="731.9" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#0083A0" textLength="33.1" lengthAdjust="spacing">delta</text></g>
      <g class="ev" style="animation-delay:2.85s"><rect x="771.5" y="478" width="55.1" height="30" rx="15.0" fill="#5B6378" fill-opacity=".13" stroke="#5B6378" stroke-opacity=".55"/><text x="799.0" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5B6378" textLength="33.1" lengthAdjust="spacing">title</text></g>
      <g class="ev" style="animation-delay:3.80s"><rect x="838.6" y="478" width="48.5" height="30" rx="15.0" fill="#006E30" fill-opacity=".13" stroke="#006E30" stroke-opacity=".55"/><text x="862.8" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#006E30" textLength="26.5" lengthAdjust="spacing">done</text></g>
      <g class="ev" style="animation-delay:4.75s"><rect x="899.1" y="478" width="55.1" height="30" rx="15.0" fill="#C43F3E" fill-opacity=".13" stroke="#C43F3E" stroke-opacity=".55"/><text x="926.6" y="497.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#C43F3E" textLength="33.1" lengthAdjust="spacing">error</text></g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="558.5" rx="15.25" fill="none"
        stroke="url(#fframe)" stroke-width="1.5"/>
</svg>
