name: Backend unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test the backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check runner resources
        run: |
          echo "=== CPU ==="
          nproc
          lscpu

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # read_page tests run real reads in the browser build.sh installs.
      - name: Install the browser read_page reads pages in
        run: scripts/install-chrome-headless-shell.sh "$RUNNER_TEMP/chrome-headless-shell"

      # read_page runs Chromium with its sandbox on. Ubuntu's AppArmor blocks
      # the unprivileged user namespaces that sandbox needs for a browser
      # outside an installed package, so the runner allows them.
      - name: Allow the browser's sandbox on the runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The read_page tests crash pages on purpose. The runner's kernel pipes a
      # crashing process's core dump to systemd-coredump, and the renderer
      # stays alive until its gigabyte heap is dumped, so the crash reaches the
      # read after its time limit. The runner discards core dumps instead.
      - name: Let a crashed browser process exit at once
        run: |
          echo "core_pattern was: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern='|/bin/false'

      # The backend tsconfig includes `test`, so this also typechecks the suite.
      - name: Typecheck the backend and its tests
        run: pnpm --filter @lys/backend exec tsc --noEmit

      # Vitest fails when it discovers no test files.
      - name: Run the unit suite
        run: pnpm --filter @lys/backend test
        env:
          LYS_TEST_BROWSER_EXECUTABLE_PATH: ${{ runner.temp }}/chrome-headless-shell/chrome-headless-shell
