<title id="lysTitle">Lys — Lysiptera Caliginia</title>
<desc id="lysDesc">A specimen plate for Lysiptera caliginia: a faceted crystal moth of violet and cyan light, cropped by the right edge of the plate, with two floating gems and a measurement rail. The line beside her reads: The universe named its oldest design flaw entropy, then taught every living thing to mistake forgetting for fate.</desc>
