<linearGradient id="wordmark" gradientUnits="userSpaceOnUse" x1="0" y1="-100" x2="250" y2="6"><stop offset="0" stop-color="#6D28A9"/><stop offset=".42" stop-color="#8B3FD4"/><stop offset="1" stop-color="#0A7C99"/></linearGradient>
